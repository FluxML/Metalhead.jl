name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
  workflow_dispatch:

# needed for julia-actions/cache to delete old caches
permissions:
  actions: write
  contents: read

# cancel superseded in-progress runs on the same ref, but never on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.suite }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # a failing prerelease must not turn the CI badge red
    continue-on-error: ${{ matrix.version == 'pre' }}
    env:
      GROUP: ${{ matrix.suite }}
      TEST_FAST: ${{ matrix.version != '1' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        suite:
          - 'Hub'
          - 'Models'
          - 'AlexNet|VGG'
          - 'GoogLeNet|SqueezeNet|MobileNet|MNASNet'
          - 'EfficientNet'
          - '^ResNet|WideResNet'
          - '^ResNeXt' # split off from ResNet to reduce overall runtime
          - 'SEResNet|SEResNeXt'
          - 'Res2Net|Res2NeXt'
          - 'Inception'
          - 'DenseNet'
          - 'UNet'
          - 'ConvNeXt|ConvMixer'
          - 'MLP-Mixer|ResMLP|gMLP'
          - 'ViT'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # contents/statuses: write are needed by deploydocs for gh-pages and PR previews
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
