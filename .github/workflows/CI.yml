name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
  workflow_dispatch:

# needed for julia-actions/cache to delete old caches
permissions:
  actions: write
  contents: read

# cancel superseded in-progress runs on the same ref, but never on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.suite }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # a failing prerelease must not turn the CI badge red
    continue-on-error: ${{ matrix.version == 'pre' }}
    env:
      TEST_FAST: ${{ matrix.version != '1' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        # test files by path prefix, see test/runtests.jl
        suite:
          - 'hub models'
          - 'legacy/alexnet legacy/vgg'
          - 'legacy/googlenet legacy/squeezenet legacy/mobilenet legacy/mnasnet'
          - 'legacy/efficientnet'
          - 'legacy/resnet legacy/wideresnet'
          - 'legacy/resnext' # split off from ResNet to reduce overall runtime
          - 'legacy/seresnet legacy/seresnext'
          - 'legacy/res2net legacy/res2next'
          - 'legacy/inception'
          - 'legacy/densenet'
          - 'legacy/unet'
          - 'legacy/convnext legacy/convmixer'
          - 'legacy/mlpmixer legacy/resmlp legacy/gmlp'
          - 'legacy/vit'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ matrix.suite }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # deploydocs pushes to gh-pages (contents) and reports the deployment (statuses)
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
